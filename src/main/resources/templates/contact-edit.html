<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${contact.id != null} ? 'Edit Contact – Yatta-Yam-Yam' : 'New Contact – Yatta-Yam-Yam'">Contact – Yatta-Yam-Yam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/orders/dashboard}">Yatta-Yam-Yam</a>
    </div>
</nav>

<div class="container py-4" style="max-width: 560px;">
    <a th:href="${returnTo}" class="btn btn-outline-secondary btn-sm mb-4">
        <i class="bi bi-arrow-left"></i> Back
    </a>

    <div class="card shadow-sm p-4">
        <h3 class="fw-bold mb-4" th:text="${contact.id != null} ? '✏️ Edit Contact' : '📇 New Contact'">Contact</h3>

        <form th:action="${contact.id != null} ? @{'/contacts/' + ${contact.id} + '/edit'} : @{/contacts/new}"
              method="post" enctype="multipart/form-data">
            <input type="hidden" name="returnTo" th:value="${returnTo}"/>

            <div class="mb-3">
                <label class="form-label fw-semibold">Name</label>
                <input type="text" name="name" class="form-control form-control-lg"
                       th:value="${contact.name}" required maxlength="100"
                       placeholder="e.g. Pizzeria Roma"/>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Location</label>
                <div class="d-flex gap-3">
                    <div class="form-check" th:each="loc, stat : ${locations}">
                        <input class="form-check-input" type="radio" name="location"
                               th:id="'loc-' + ${loc.name()}" th:value="${loc.name()}"
                               th:checked="${contact.location != null ? contact.location == loc : stat.first}"
                               required/>
                        <label class="form-check-label" th:for="'loc-' + ${loc.name()}"
                               th:text="${#strings.capitalize(#strings.toLowerCase(loc.name()))}">Location</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Address <span class="text-muted fw-normal small">(optional)</span>
                </label>
                <input type="text" name="address" class="form-control"
                       th:value="${contact.address}" maxlength="255"
                       placeholder="Street, ZIP City"/>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Phone Numbers</label>
                <div id="phoneNumbers">
                    <div class="input-group mb-2 phone-row" th:each="phone : ${contact.phoneNumbers}">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" name="phoneNumbers" class="form-control"
                               th:value="${phone}" maxlength="50"/>
                        <button type="button" class="btn btn-outline-danger" onclick="removePhone(this)"
                                title="Remove number">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <div class="input-group mb-2 phone-row" th:if="${contact.phoneNumbers.empty}">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" name="phoneNumbers" class="form-control"
                               maxlength="50" placeholder="+49 561 123456"/>
                        <button type="button" class="btn btn-outline-danger" onclick="removePhone(this)"
                                title="Remove number">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="addPhone()">
                    <i class="bi bi-plus-lg"></i> Add number
                </button>
            </div>

            <!-- Current image preview -->
            <div th:if="${contact.imageUrl != null and !contact.imageUrl.isEmpty()}" class="mb-3">
                <label class="form-label fw-semibold">Current Image</label>
                <div class="d-flex align-items-center gap-3">
                    <img th:src="${contact.imageUrl}" alt="Current image" class="contact-avatar"/>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="removeImage" value="true" id="removeImage"/>
                        <label class="form-check-label" for="removeImage">Remove image</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Image URL
                    <span class="text-muted fw-normal small">(optional)</span>
                </label>
                <input type="text" name="imageUrl" class="form-control"
                       th:value="${contact.imageUrl}"
                       placeholder="https://example.com/logo.png"/>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Or Upload Image
                    <span class="text-muted fw-normal small">(optional)</span>
                </label>
                <input type="file" name="imageFile" class="form-control" accept="image/*"
                       onchange="checkFileSize(this, 100)"/>
                <small class="text-muted">Max file size: 100 MB</small>
                <div class="text-danger small mt-1" id="fileSizeError" style="display:none">
                    <i class="bi bi-exclamation-triangle"></i>
                    File is too large. Maximum allowed size is 100 MB.
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg"
                        th:text="${contact.id != null} ? 'Save Changes' : 'Create Contact'">Save</button>
                <a th:href="${returnTo}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>

        <form th:if="${contact.id != null}"
              th:action="@{'/contacts/' + ${contact.id} + '/delete'}" method="post" class="mt-3"
              onsubmit="return confirm('Delete this contact?');">
            <div class="d-grid">
                <button type="submit" class="btn btn-outline-danger">
                    <i class="bi bi-trash"></i> Delete Contact
                </button>
            </div>
        </form>
    </div>

    <div class="version-footer"><a th:href="@{/version}" th:text="'v' + ${@environment.getProperty('spring.application.version')}">v?</a></div>
</div>

<template id="phoneRowTemplate">
    <div class="input-group mb-2 phone-row">
        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
        <input type="tel" name="phoneNumbers" class="form-control" maxlength="50"/>
        <button type="button" class="btn btn-outline-danger" onclick="removePhone(this)"
                title="Remove number">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function addPhone() {
        const row = document.getElementById('phoneRowTemplate').content.cloneNode(true);
        document.getElementById('phoneNumbers').appendChild(row);
        const inputs = document.querySelectorAll('#phoneNumbers input');
        inputs[inputs.length - 1].focus();
    }

    function removePhone(btn) {
        const rows = document.querySelectorAll('#phoneNumbers .phone-row');
        // Keep at least one (empty) row so a number can always be entered
        if (rows.length > 1) {
            btn.closest('.phone-row').remove();
        } else {
            btn.closest('.phone-row').querySelector('input').value = '';
        }
    }

    function checkFileSize(input, maxMB) {
        const error = document.getElementById('fileSizeError');
        const submitBtn = input.closest('form').querySelector('button[type="submit"]');
        if (input.files.length > 0) {
            const sizeMB = input.files[0].size / (1024 * 1024);
            if (sizeMB > maxMB) {
                error.style.display = 'block';
                input.value = '';
                if (submitBtn) submitBtn.disabled = true;
            } else {
                error.style.display = 'none';
                if (submitBtn) submitBtn.disabled = false;
            }
        }
    }
</script>
</body>
</html>
