<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Contacts – Yatta-Yam-Yam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/orders/dashboard}">Yatta-Yam-Yam</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="d-flex align-items-center gap-2 text-decoration-none">
                <div class="user-badge">
                    <span th:text="${#strings.toUpperCase(#strings.substring(user.name,0,1))}">A</span>
                </div>
                <span class="text-white fw-semibold" th:text="${user.name}">Name</span>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 860px;">

    <a th:href="@{/orders/dashboard}" class="text-muted small text-decoration-none">
        <i class="bi bi-arrow-left"></i> Dashboard
    </a>

    <div class="d-flex justify-content-between align-items-center mb-3 mt-1 flex-wrap gap-2">
        <div>
            <h2 class="fw-bold mb-0"><i class="bi bi-person-rolodex"></i> Contacts</h2>
            <p class="text-muted mb-0" th:text="${contacts.size()} + ' contact(s)'"></p>
        </div>
        <a th:href="@{/contacts/new(returnTo=${returnTo})}"
           class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> New Contact
        </a>
    </div>

    <!-- Location filter -->
    <div class="mb-4 d-flex gap-2 flex-wrap">
        <a th:href="@{/contacts}"
           th:classappend="${selectedLocation == null} ? 'btn-primary' : 'btn-outline-secondary'"
           class="btn btn-sm">All</a>
        <a th:each="loc : ${locations}"
           th:href="@{/contacts(location=${loc.name()})}"
           th:classappend="${selectedLocation != null and selectedLocation == loc.name()} ? 'btn-primary' : 'btn-outline-secondary'"
           class="btn btn-sm"
           th:text="${#strings.capitalize(#strings.toLowerCase(loc.name()))}">Location</a>
    </div>

    <!-- Empty state -->
    <div th:if="${contacts.empty}" class="empty-state text-center py-5">
        <div class="empty-icon mb-3">📇</div>
        <h4 class="fw-bold">No contacts yet</h4>
        <p class="text-muted">Add restaurants and delivery services so their numbers are at hand when ordering.</p>
        <a th:href="@{/contacts/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add First Contact
        </a>
    </div>

    <!-- Contact list -->
    <div th:if="${!contacts.empty}" class="list-group shadow-sm">
        <div th:each="contact : ${contacts}" class="list-group-item py-3">
            <div class="d-flex gap-3 align-items-start">
                <img th:if="${contact.imageUrl != null and !contact.imageUrl.isEmpty()}"
                     th:src="${contact.imageUrl}" alt="" class="contact-avatar"/>
                <div th:unless="${contact.imageUrl != null and !contact.imageUrl.isEmpty()}"
                     class="contact-avatar contact-avatar-initial">
                    <span th:text="${#strings.toUpperCase(#strings.substring(contact.name,0,1))}">A</span>
                </div>

                <div class="flex-grow-1" style="min-width:0;">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <h5 class="fw-bold mb-0" th:text="${contact.name}">Name</h5>
                        <span class="badge text-bg-light border">
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="${#strings.capitalize(#strings.toLowerCase(contact.location.name()))}">Location</span>
                        </span>
                    </div>
                    <div th:if="${contact.address != null}" class="text-muted small mt-1">
                        <i class="bi bi-house"></i>
                        <span th:text="${contact.address}">Address</span>
                    </div>
                    <div class="mt-2 d-flex flex-wrap gap-2">
                        <a th:each="phone : ${contact.phoneNumbers}"
                           th:href="'tel:' + ${phone}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-telephone"></i>
                            <span th:text="${phone}">Number</span>
                        </a>
                        <span th:if="${contact.phoneNumbers.empty}" class="text-muted small">
                            No phone number
                        </span>
                    </div>
                </div>

                <a th:href="@{'/contacts/' + ${contact.id} + '/edit'(returnTo=${returnTo})}"
                   class="btn btn-outline-secondary btn-sm flex-shrink-0">
                    <i class="bi bi-pencil"></i> Edit
                </a>
            </div>
        </div>
    </div>

    <div class="version-footer"><a th:href="@{/version}" th:text="'v' + ${@environment.getProperty('spring.application.version')}">v?</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
