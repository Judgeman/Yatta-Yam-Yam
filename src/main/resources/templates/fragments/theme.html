<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

<!-- Colour theme for every page; include as the last element in <head>:
     <th:block th:replace="~{fragments/theme :: head}"></th:block>
     theme.js sets data-bs-theme (light/dark from the OS setting) before the first paint.
     The seasonal styles (christmas, easter, halloween, muertos, garlic, pizza, mario) only apply during their
     season or a preview, the link-only pelmeni.css, pasta.css, gta.css and pokemon.css only in their ?theme=... preview, symbolics.css only while the hidden Symbolics mode is on (see
     theme.js). visitors.js sends the season's visitors across the screen; they are drawn
     in the seasonal scripts (which run after it, in this order) and styled in visitors.css.
     symbolics.js builds the command line of the Symbolics mode at the bottom of the screen.
     theme-info.js adds the (i) button about the current look to the menu bar. -->
<th:block th:fragment="head">
    <meta name="color-scheme" content="light dark"/>
    <link rel="stylesheet" th:href="@{/css/christmas.css}"/>
    <link rel="stylesheet" th:href="@{/css/easter.css}"/>
    <link rel="stylesheet" th:href="@{/css/halloween.css}"/>
    <link rel="stylesheet" th:href="@{/css/muertos.css}"/>
    <link rel="stylesheet" th:href="@{/css/garlic.css}"/>
    <link rel="stylesheet" th:href="@{/css/pizza.css}"/>
    <link rel="stylesheet" th:href="@{/css/pelmeni.css}"/>
    <link rel="stylesheet" th:href="@{/css/pasta.css}"/>
    <link rel="stylesheet" th:href="@{/css/gta.css}"/>
    <link rel="stylesheet" th:href="@{/css/pokemon.css}"/>
    <link rel="stylesheet" th:href="@{/css/mario.css}"/>
    <link rel="stylesheet" th:href="@{/css/visitors.css}"/>
    <link rel="stylesheet" th:href="@{/css/symbolics.css}"/>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/visitors.js}" defer></script>
    <script th:src="@{/js/christmas.js}" defer></script>
    <script th:src="@{/js/easter.js}" defer></script>
    <script th:src="@{/js/halloween.js}" defer></script>
    <script th:src="@{/js/muertos.js}" defer></script>
    <script th:src="@{/js/garlic.js}" defer></script>
    <script th:src="@{/js/pizza.js}" defer></script>
    <script th:src="@{/js/pelmeni.js}" defer></script>
    <script th:src="@{/js/pasta.js}" defer></script>
    <script th:src="@{/js/gta.js}" defer></script>
    <script th:src="@{/js/pokemon.js}" defer></script>
    <script th:src="@{/js/mario.js}" defer></script>
    <script th:src="@{/js/symbolics.js}" defer></script>
    <script th:src="@{/js/theme-info.js}" defer></script>
    <!-- January only (wrappedYear from WrappedHintAdvice), for logged-in users, not on
         the Wrapped pages themselves: a small hint at the bottom right linking to the
         past year's review. A <template> is allowed in <head>; wrapped-hint.js places it in <body>. -->
    <th:block th:if="${wrappedYear != null and user != null and hideWrappedHint == null}">
        <template id="yy-wrapped-hint">
            <div class="wrapped-hint" th:data-year="${wrappedYear}">
                <a th:href="@{/wrapped(year=${wrappedYear})}" class="wrapped-hint-link"
                   th:title="'Your ' + ${wrappedYear} + ' Wrapped'">
                    <span class="wrapped-hint-icon" aria-hidden="true">🎁</span>
                    <span class="wrapped-hint-text" th:text="'Your ' + ${wrappedYear} + ' Wrapped'">Your Wrapped</span>
                </a>
                <button type="button" class="wrapped-hint-min" aria-label="Shrink this hint" title="Shrink">&times;</button>
            </div>
        </template>
        <script th:src="@{/js/wrapped-hint.js}" defer></script>
    </th:block>
</th:block>

</head>
</html>
